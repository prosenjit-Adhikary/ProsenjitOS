name: Emergency Artifact Cleanup

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Optional: Runs automatically every day at midnight to prevent future quota issues
  schedule:
    - cron: '0 0 * * *'

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required permission to delete artifacts
    
    steps:
      - name: Delete all old artifacts
        uses: jimschubert/delete-artifacts-action@v1
        with:
          log_level: 'info'
          min_bytes: '0' # Delete everything regardless of size
