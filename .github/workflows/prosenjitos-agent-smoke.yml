name: ProsenjitOS agent smoke test

on:
  push:
    branches:
      - agent/prosenjitos-agent

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools gcc binutils qemu-system-x86

      - name: Agent syntax and install
        run: |
          bash -n prosenjitos-agent
          bash -n setup-prosenjitos-agent.sh
          ./setup-prosenjitos-agent.sh
          test -x "$HOME/.local/bin/prosenjitos-agent"

      - name: Run diagnostic agent
        env:
          PROSENJITOS_REPO: ${{ github.workspace }}
        run: |
          set +e
          prosenjitos-agent diagnose
          rc=$?
          set -e
          test -f reports/latest.txt
          test -f reports/latest.json
          test -f reports/ai-handoff.txt
          echo "agent diagnose exit: $rc"
          exit "$rc"

      - name: Upload agent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosenjitos-agent-report
          path: |
            reports/latest.txt
            reports/latest.json
            reports/ai-handoff.txt
            reports/.agent-*/
