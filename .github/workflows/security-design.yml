name: Security architecture checks

# Automatic PR/push validation runs in build.yml to avoid concurrent jobs
# sharing the self-hosted runner's global _temp command files. Keep manual runs available.
on:
  workflow_dispatch:

# Keep security checks deduplicated without replacing the build workflow's pending run.
concurrency:
  group: prosenjitos-security-design
  cancel-in-progress: false

jobs:
  security-design:
    # Keep all repository validation on the owner's local Linux x64 self-hosted runner.
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        shell: bash
        working-directory: security-run
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: security-run

      - name: Validate security architecture contract
        shell: bash
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
