name: Security architecture checks

on:
  push:
    branches: [main]
  pull_request:

# Ensure stale queued security checks do not block verification of the latest PR head.
concurrency:
  group: prosenjitos-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-design:
    # PR verification uses GitHub-hosted Ubuntu; pushes to main retain the local runner.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 600 && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate security architecture contract
        shell: bash
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
