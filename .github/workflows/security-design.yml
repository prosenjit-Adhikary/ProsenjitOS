name: Security architecture checks

on:
  # Keep mainline pushes tested without duplicate push + PR runs.
  push:
    branches: [main]
  pull_request:

jobs:
  security-design:
    # Keep security verification on the designated OfficeWindows self-hosted runner.
    runs-on: [self-hosted, OfficeWindows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate security architecture contract
        # OfficeWindows is a Windows host; use the installed Git-for-Windows Bash explicitly.
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
