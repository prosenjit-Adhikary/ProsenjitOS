name: Security architecture checks

# Automatic PR/push validation runs in build.yml to avoid concurrent jobs
# sharing the self-hosted runner's global _temp command files. Keep manual runs available.
on:
  workflow_dispatch:

# Keep security checks deduplicated without replacing the build workflow's pending run.
concurrency:
  group: prosenjitos-build-shared-workspace
  cancel-in-progress: false

jobs:
  security-design:
    # Keep all repository validation on the owner's local Linux x64 self-hosted runner.
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        shell: bash
        working-directory: security-run
    steps:
      - name: Checkout source using Git directly
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf security-run
          mkdir -p security-run
          cd security-run
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "Fetching immutable workflow commit: $GITHUB_SHA"
          set +e
          GIT_TERMINAL_PROMPT=0 timeout --signal=TERM --kill-after=5s 90s git -c http.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$GITHUB_SHA" 2>&1
          fetch_status=$?
          set -e
          if (( fetch_status != 0 )); then
            echo "::error::Git fetch failed or timed out (exit $fetch_status); check local runner network/token connectivity."
            exit "$fetch_status"
          fi
          git checkout --detach "$GITHUB_SHA"

      - name: Validate security architecture contract
        shell: bash
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
