name: Security architecture checks

on:
  push:
    branches: [main]
  pull_request:

# Ensure stale queued security checks do not block verification of the latest PR head.
concurrency:
  group: prosenjitos-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Keep the security contract gate on the same selected runner policy as build.
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.select.outputs.labels }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Select an idle local runner or fall back to GitHub-hosted
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the repository's local runner only when a matching runner is
          # online and idle. If the API is unavailable, fail open to GitHub-hosted
          # so validation does not remain queued waiting for an offline machine.
          if runners_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" 2>/dev/null)"; then
            idle_local_count="$(jq '[.runners[]?
              | select(.status == "online" and .busy == false)
              | ([.labels[]?.name] | (index("self-hosted") != null and index("linux") != null and index("x64") != null))
            ] | length' <<< "$runners_json")"
          else
            echo "::warning::Could not inspect repository runners; selecting GitHub-hosted runner."
            idle_local_count=0
          fi

          if (( idle_local_count > 0 )); then
            echo 'labels=["self-hosted","linux","x64"]' >> "$GITHUB_OUTPUT"
            echo 'mode=local' >> "$GITHUB_OUTPUT"
            echo "Selected an online, idle self-hosted Linux x64 runner."
          else
            echo 'labels=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'mode=github-hosted' >> "$GITHUB_OUTPUT"
            echo "No online, idle self-hosted Linux x64 runner is available; using ubuntu-latest."
          fi

  security-design:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.labels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate security architecture contract
        shell: bash
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
