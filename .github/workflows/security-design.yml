name: Security architecture checks

# Share the build workflow's concurrency group: both jobs use the same
# self-hosted workspace and must not run checkout/cleanup concurrently.
concurrency:
  group: prosenjitos-self-hosted-linux-x64
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-design:
    # This check uses Bash. Let GitHub schedule it across either Linux X64 runner
    # (office or office1); OfficeWindows remains eligible for Windows-compatible jobs.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate security architecture contract
        shell: bash
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
