name: Security architecture checks

# This workflow shares the self-hosted runner workspace with the build workflow.
# Use the same group to prevent concurrent checkout/clean operations.
concurrency:
  group: prosenjitos-selfhosted-workspace
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-design:
    # This Bash-based check runs on any available self-hosted Linux x64 runner.
    # GitHub-hosted runners and non-Linux runners are intentionally excluded.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout source without runner file-command action
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          remote_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$remote_url"
          else
            git remote add origin "$remote_url"
          fi
          git reset --hard
          git clean -ffd
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if [[ -n "${PR_NUMBER:-}" ]]; then
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          fi
          git checkout --detach FETCH_HEAD
          git status --short --branch

      - name: Validate security architecture contract
        shell: bash
        run: |
          set -euo pipefail

          test -s docs/SECURITY-MALWARE.md

          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )

          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done

          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md

          echo "Security architecture contract validated."
