name: Build and boot-test ProsenjitOS

# scripts/build.sh currently uses the shared repository-local build/ directory.
# Serialize all build workflow runs until builds use isolated output directories.
concurrency:
  group: prosenjitos-build-shared-workspace
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Public-repository CI uses a clean GitHub-hosted Linux runner.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: build-run
    steps:
      - name: Checkout source using Git directly
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf build-run
          mkdir -p build-run
          cd build-run
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "Fetching immutable workflow commit: $GITHUB_SHA"
          set +e
          GIT_TERMINAL_PROMPT=0 timeout --signal=TERM --kill-after=5s 90s git -c http.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$GITHUB_SHA" 2>&1
          fetch_status=$?
          set -e
          if (( fetch_status != 0 )); then
            echo "::error::Git fetch failed or timed out (exit $fetch_status); check local runner network/token connectivity."
            exit "$fetch_status"
          fi
          git checkout --detach "$GITHUB_SHA"

      - name: Install native build and QEMU dependencies
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            nasm grub-common grub-pc-bin xorriso mtools qemu-system-x86

      - name: Identify selected runner and verify toolchain
        run: |
          set -eu
          echo "Selected runner: ${RUNNER_NAME:-unknown}"
          echo "Selected runner OS: ${RUNNER_OS:-unknown}"
          for tool in bash make cc nasm grub-file grub-mkrescue xorriso mcopy gcc ld qemu-system-x86_64 timeout; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing required tool: $tool"
              exit 1
            fi
          done

      - name: Validate desktop and security test scripts
        run: |
          set -euo pipefail
          bash -n scripts/desktop_complete.sh
          bash -n scripts/test_desktop_manager.sh
          bash -n scripts/test_security_control_center_protocol.sh
          bash -n scripts/test_security_control_center_service.sh

      - name: Validate security architecture contract
        run: |
          set -euo pipefail
          test -s docs/SECURITY-MALWARE.md
          required=(
            "TRUSTED"
            "VERIFIED"
            "UNKNOWN"
            "SUSPICIOUS"
            "MALICIOUS"
            "SHA-256"
            "Digital signatures"
            "Quarantine"
            "Behavior monitoring"
            "Reason Ledger"
            "offline"
            "provider adapters"
          )
          for marker in "${required[@]}"; do
            if ! grep -Fqi -- "$marker" docs/SECURITY-MALWARE.md; then
              echo "::error::Security architecture marker missing: $marker"
              exit 1
            fi
          done
          grep -Fqi -- "File admission/security broker" docs/ROADMAP.md
          grep -Fqi -- "Malware containment tests" docs/ROADMAP.md
          echo "Security architecture contract validated."

      - name: Run DML desktop manager unit tests
        run: make desktop-unit-test

      - name: Run driver telemetry namespace tests
        run: make driver-telemetry-test

      - name: Run SCC protocol parser tests
        run: make security-protocol-test

      - name: Run SCC service dispatcher tests
        run: make security-service-test

      - name: Run SCC protocol parser sanitizer tests
        env:
          SCC_SANITIZERS: "1"
        run: bash scripts/test_security_control_center_protocol.sh

      - name: Build ISO
        timeout-minutes: 12
        run: |
          set -euo pipefail
          echo "===== Runner resources before build ====="
          df -h .
          free -h || true
          chmod +x scripts/build.sh
          timeout --signal=TERM --kill-after=10s 300s bash -x scripts/build.sh 2>&1 | tee build-script.log

      - name: Diagnose ISO build failure
        if: failure()
        run: |
          set +e
          echo "===== Runner identity ====="
          echo "runner=${RUNNER_NAME:-unknown} os=${RUNNER_OS:-unknown}"
          echo "===== Disk space ====="
          df -h .
          echo "===== Memory ====="
          free -h
          echo "===== Build trace tail ====="
          if [[ -f build-script.log ]]; then tail -n 250 build-script.log; else echo "build-script.log was not created"; fi
          echo "===== Partial build outputs ====="
          find build -maxdepth 2 -type f -printf '%p %s bytes\\n' 2>/dev/null | sort | tail -n 100 || true

      - name: Diagnose ProsenjitFS block-init call/return path
        run: |
          echo "===== block_device_init disassembly ====="
          objdump -d -Mintel build/prosenjit.elf | grep -n -B 8 -A 70 '<block_device_init>:' || true
          echo "===== direct call sites to block_device_init ====="
          objdump -d -Mintel build/prosenjit.elf | grep -n -B 10 -A 10 'call.*<block_device_init>' || true
          echo "===== filesystem self-test entry ====="
          objdump -d -Mintel build/prosenjit.elf | grep -n -B 3 -A 24 '<prosenjitfs_selftest>:' || true

      - name: Boot-test ISO in QEMU
        run: |
          set -e
          mkdir -p build
          : > build/qemu-serial.log
          : > build/qemu-debug.log
          set +e
          timeout --kill-after=5s 90s qemu-system-x86_64 \
            -cdrom build/prosenjitOS.iso \
            -display none \
            -serial stdio \
            -no-reboot \
            -no-shutdown \
            -d guest_errors,unimp \
            -D build/qemu-debug.log 2>&1 | tee build/qemu-serial.log
          pipeline_status=("${PIPESTATUS[@]}")
          qemu_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          set -e
          if (( tee_status != 0 )); then
            echo "::error::Failed to capture ISO QEMU serial output (tee exit $tee_status)"
            exit "$tee_status"
          fi

          echo "QEMU exit status: $qemu_status"
          # The OS normally remains halted after successful milestones, so timeout(124)
          # is an expected termination. Any other QEMU/timeout failure is a real failure.
          if (( qemu_status != 0 && qemu_status != 124 )); then
            echo "::error::QEMU exited with unexpected status: $qemu_status"
            exit "$qemu_status"
          fi
          cat build/qemu-serial.log
          echo "===== QEMU guest error trace ====="
          grep -E "guest_errors|unimp|exception|check_exception" build/qemu-debug.log | tail -n 120 || true
          echo "===== QEMU exception diagnostics (tail) ====="
          tail -n 200 build/qemu-debug.log || true

          require_log() {
            local marker="$1"
            if ! grep -Fq "$marker" build/qemu-serial.log; then
              echo "::error::Missing QEMU milestone: $marker"
              return 1
            fi
          }

          require_log "ProsenjitOS: x86-64 long mode active"
          require_log "ProsenjitOS: physical memory deep invariant self-test passed"
          require_log "ProsenjitOS: page allocation/free test passed"
          require_log "ProsenjitOS: paging deep invariant self-test passed"
          require_log "ProsenjitOS: kernel heap allocation/free test passed"
          require_log "ProsenjitOS: kernel heap deep invariant self-test passed"
          require_log "ProsenjitOS: address-space deep isolation self-test passed"
          require_log "ProsenjitOS: system health/drop-counter self-test passed"
          require_log "ProsenjitOS: system health monitor initialized"
          require_log "ProsenjitOS: persistent crash record self-test passed"
          require_log "ProsenjitOS: ELF validation negative self-test passed"
          require_log "ProsenjitOS: /init filesystem-boundary negative self-test passed"
          require_log "ProsenjitOS: block storage health self-test passed"
          require_log "ProsenjitOS: syscall dispatcher ABI/policy self-test passed"
          require_log "ProsenjitOS: security runtime verification passed (process policy + kernel W^X/NX)"
          require_log "ProsenjitOS: process lifecycle/parent/exit-wait test passed"
          require_log "ProsenjitOS: process state validation regression passed"
          require_log "ProsenjitOS: process resource cleanup regression passed"
          require_log "ProsenjitOS: address-space switch/reap regression passed"
          require_log "ProsenjitOS: parent/child lifetime ordering regression passed"
          require_log "ProsenjitOS: thread lifecycle/run-queue scheduler test passed"
          require_log "ProsenjitOS: process-thread teardown regression passed"
          require_log "ProsenjitOS: IPC wait-queue block/wakeup test passed"
          require_log "ProsenjitOS: interrupt-frame scheduler save/restore test passed"
          require_log "ProsenjitOS: partition discovery self-test passed"
          require_log "ProsenjitOS: VFS provider registry boundary self-test passed"
          require_log "ProsenjitOS: process lifecycle self-test passed"
          require_log "ProsenjitOS: storage volume discovery self-test passed"
          require_log "ProsenjitOS: ProsenjitFS format/mount/allocation/journal/recovery self-test passed"
          require_log "ProsenjitOS: service manager dependency/lifecycle self-test passed"
          require_log "ProsenjitOS: driver model registry/lifecycle self-test passed"
          require_log "ProsenjitOS: device permission broker self-test passed"
          require_log "ProsenjitOS: display-device binding self-test passed"
          require_log "ProsenjitOS: network protocol/socket self-test passed"
          require_log "ProsenjitOS: PCI enumeration passed; devices ="
          require_log "ProsenjitOS: ELF64 userspace image loaded, mapped, and stack-validated"
          require_log "ProsenjitOS: CPL3 user-mode and IPC syscall test passed"

      - name: Boot-test native BIOS image in QEMU
        run: |
          set -e
          mkdir -p build
          : > build/native-qemu-serial.log
          : > build/native-qemu-debug.log
          set +e
          timeout --kill-after=5s 90s qemu-system-x86_64 \
            -drive format=raw,file=build/prosenjit-native-bios.img,if=ide \
            -display none \
            -serial stdio \
            -no-reboot \
            -no-shutdown \
            -d guest_errors,unimp \
            -D build/native-qemu-debug.log 2>&1 | tee build/native-qemu-serial.log
          pipeline_status=("${PIPESTATUS[@]}")
          qemu_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          set -e
          if (( tee_status != 0 )); then
            echo "::error::Failed to capture native QEMU serial output (tee exit $tee_status)"
            exit "$tee_status"
          fi

          echo "Native QEMU exit status: $qemu_status"
          # A timeout after all required milestones is expected; every other
          # non-zero QEMU result must fail the job rather than being masked.
          if (( qemu_status != 0 && qemu_status != 124 )); then
            echo "::error::Native QEMU exited with unexpected status: $qemu_status"
            exit "$qemu_status"
          fi
          cat build/native-qemu-serial.log
          echo "===== Native QEMU guest error trace ====="
          grep -E "guest_errors|unimp|exception|check_exception" build/native-qemu-debug.log | tail -n 120 || true
          echo "===== Native QEMU exception diagnostics (tail) ====="
          tail -n 200 build/native-qemu-debug.log || true

          require_native_log() {
            local marker="$1"
            if ! grep -Fq "$marker" build/native-qemu-serial.log; then
              echo "::error::Missing native BIOS milestone: $marker"
              return 1
            fi
          }

          require_native_log "ProsenjitOS: native bootloader handoff accepted"
          require_native_log "ProsenjitOS: ATA PIO real-disk block path self-test passed"
          require_native_log "ProsenjitOS: native filesystem LBA boundary diagnostic passed"
          require_native_log "ProsenjitOS: ATA PIO -> MBR -> ProsenjitFS persistent mount test passed"
          require_native_log "ProsenjitOS: x86-64 long mode active"
          require_native_log "ProsenjitOS: physical memory deep invariant self-test passed"
          require_native_log "ProsenjitOS: page allocation/free test passed"
          require_native_log "ProsenjitOS: paging deep invariant self-test passed"
          require_native_log "ProsenjitOS: kernel heap allocation/free test passed"
          require_native_log "ProsenjitOS: kernel heap deep invariant self-test passed"
          require_native_log "ProsenjitOS: address-space deep isolation self-test passed"
          require_native_log "ProsenjitOS: system health/drop-counter self-test passed"
          require_native_log "ProsenjitOS: system health monitor initialized"
          require_native_log "ProsenjitOS: persistent crash record self-test passed"
          require_native_log "ProsenjitOS: ELF validation negative self-test passed"
          require_native_log "ProsenjitOS: /init filesystem-boundary negative self-test passed"
          require_native_log "ProsenjitOS: block storage health self-test passed"
          require_native_log "ProsenjitOS: syscall dispatcher ABI/policy self-test passed"
          require_native_log "ProsenjitOS: security runtime verification passed (process policy + kernel W^X/NX)"
          require_native_log "ProsenjitOS: process lifecycle/parent/exit-wait test passed"
          require_native_log "ProsenjitOS: process state validation regression passed"
          require_native_log "ProsenjitOS: process resource cleanup regression passed"
          require_native_log "ProsenjitOS: address-space switch/reap regression passed"
          require_native_log "ProsenjitOS: parent/child lifetime ordering regression passed"
          require_native_log "ProsenjitOS: thread lifecycle/run-queue scheduler test passed"
          require_native_log "ProsenjitOS: process-thread teardown regression passed"
          require_native_log "ProsenjitOS: IPC wait-queue block/wakeup test passed"
          require_native_log "ProsenjitOS: interrupt-frame scheduler save/restore test passed"
          require_native_log "ProsenjitOS: partition discovery self-test passed"
          require_native_log "ProsenjitOS: VFS provider registry boundary self-test passed"
          require_native_log "ProsenjitOS: process lifecycle self-test passed"
          require_native_log "ProsenjitOS: storage volume discovery self-test passed"
          require_native_log "ProsenjitOS: ProsenjitFS format/mount/allocation/journal/recovery self-test passed"
          require_native_log "ProsenjitOS: service manager dependency/lifecycle self-test passed"
          require_native_log "ProsenjitOS: driver model registry/lifecycle self-test passed"
          require_native_log "ProsenjitOS: device permission broker self-test passed"
          require_native_log "ProsenjitOS: display-device binding self-test passed"
          require_native_log "ProsenjitOS: network protocol/socket self-test passed"
          require_native_log "ProsenjitOS: PCI enumeration passed; devices ="
          require_native_log "ProsenjitOS: ELF64 userspace image loaded, mapped, and stack-validated"
          require_native_log "ProsenjitOS: CPL3 user-mode and IPC syscall test passed"

      # QEMU serial/debug output is already printed in the job log. Skip artifact upload
      # because the GitHub Actions artifact quota is exhausted on this repository.
