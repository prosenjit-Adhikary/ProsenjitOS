name: Build and boot-test ProsenjitOS
# CI validation: push/PR runs are intentionally enabled for isolated branches.
# Isolated validation trigger for the latest ProsenjitFS formatter fix.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools gcc binutils qemu-system-x86

      - name: Build and smoke-test host ProsenjitFS formatter
        run: |
          mkdir -p build
          gcc -std=c11 -D_FILE_OFFSET_BITS=64 -Wall -Wextra -Werror -O2 -Iinclude tools/mkprosenjitfs.c -o build/mkprosenjitfs
          ./build/mkprosenjitfs build/prosenjitfs-test.img 1 512
          test "$(od -An -tx1 -N8 build/prosenjitfs-test.img | tr -d ' \\n')" = "504a534653303100"
          cmp <(dd if=build/prosenjitfs-test.img bs=512 count=1 status=none) <(dd if=build/prosenjitfs-test.img bs=512 skip=1 count=1 status=none)

      - name: Build ISO
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Prepare QEMU ProsenjitFS disk
        run: |
          gcc -std=c11 -D_FILE_OFFSET_BITS=64 -Wall -Wextra -Werror -O2 -Iinclude tools/mkprosenjitfs.c -o build/mkprosenjitfs
          ./build/mkprosenjitfs build/prosenjitfs-partition.img 32 512
          truncate -s 40M build/prosenjitfs-qemu.img
          dd if=/dev/zero of=build/prosenjitfs-qemu.img bs=512 seek=0 count=1 conv=notrunc status=none
          dd if=build/prosenjitfs-partition.img of=build/prosenjitfs-qemu.img bs=512 seek=2048 conv=notrunc status=none
          python3 - <<'PY'
          import struct
          p = "build/prosenjitfs-qemu.img"
          with open(p, "r+b") as f:
              mbr = bytearray(512)
              mbr[446:462] = bytes([0,0,2,0,0xDA,0xFF,0xFF,0xFF]) + struct.pack("<II", 2048, 65536)
              mbr[510:512] = b"\x55\xAA"
              f.seek(0)
              f.write(mbr)
          PY

      - name: Boot-test ISO in QEMU
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -boot order=d \
            -cdrom build/prosenjitOS.iso \
            -drive file=build/prosenjitfs-qemu.img,format=raw,if=ide,index=0,media=disk \
            -display none \
            -serial file:build/qemu-serial.log \
            -no-reboot \
            -no-shutdown \
            -d int \
            -D build/qemu-debug.log
          qemu_status=$?
          set -e

          echo "QEMU exit status: $qemu_status"
          cat build/qemu-serial.log
          echo "===== QEMU interrupt trace (exceptions) ====="
          grep -E "v=0[0-9a-f]|exception|check_exception" build/qemu-debug.log | tail -n 120 || true
          echo "===== QEMU exception diagnostics (tail) ====="
          tail -n 200 build/qemu-debug.log || true

          require_log() {
            local marker="$1"
            if ! grep -Fq "$marker" build/qemu-serial.log; then
              echo "::error::Missing QEMU milestone: $marker"
              return 1
            fi
          }

          require_log "ProsenjitOS: CPL3 user-mode and IPC syscall test passed"
          require_log "ProsenjitOS: x86-64 long mode active"
          require_log "ProsenjitOS: page allocation/free test passed"
          require_log "ProsenjitOS: kernel heap allocation/free test passed"
          require_log "ProsenjitOS: process lifecycle/parent/exit-wait test passed"
          require_log "ProsenjitOS: process state validation regression passed"
          require_log "ProsenjitOS: process resource cleanup regression passed"
          require_log "ProsenjitOS: IPC channel/capability foundation test passed"
          require_log "ProsenjitOS: CPL3 user-mode and IPC syscall test passed"
          require_log "ProsenjitOS: IPC wait-queue block/wakeup test passed"
          require_log "ProsenjitOS: thread lifecycle/run-queue scheduler test passed"
          require_log "ProsenjitOS: interrupt-frame scheduler save/restore test passed"
          require_log "ProsenjitOS: duplicate authorization attenuation test passed"
          require_log "ProsenjitOS: intent -> capability -> policy -> decision -> reason-ledger -> quarantine test passed"
          require_log "ProsenjitOS: limited-process capability policy test passed"
          require_log "ProsenjitOS: capability handle/rights test passed"
          require_log "ProsenjitOS: process capability authorization test passed"
          require_log "ProsenjitOS: syscall sandbox enforcement test passed"
          require_log "ProsenjitOS: limited-process syscall sandbox test passed"
          require_log "ProsenjitOS: partition discovery self-test passed"
          require_log "ProsenjitOS: FAT32 self-test passed"
          require_log "ProsenjitOS: exFAT self-test passed"
          require_log "ProsenjitOS: exFAT Up-case parser self-test passed"
          require_log "ProsenjitOS: ProsenjitFS format/mount/allocation/journal self-test passed"
          require_log "ProsenjitOS: QEMU ATA PIO ProsenjitFS persistence test passed"
          require_log "ProsenjitOS: exFAT Up-case/Unicode VFS self-test passed"
          require_log "ProsenjitOS: NTFS directory path traversal test passed"
          require_log "ProsenjitOS: NTFS UpCase case-folding test passed"
          require_log "ProsenjitOS: NTFS file-data read test passed"
          require_log "ProsenjitOS: NTFS file-data write test passed"
          require_log "ProsenjitOS: NTFS VFS read test passed"
          require_log "ProsenjitOS: capability copy-transfer test passed"
          require_log "ProsenjitOS: capability move-transfer test passed"
          require_log "ProsenjitOS: inactive capability move regression passed"
          require_log "ProsenjitOS: user address-space isolation foundation test passed"
          require_log "ProsenjitOS: usercopy page-fault recovery test passed"

      - name: Upload ISO and boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prosenjitOS-boot-test
          path: |
            build/prosenjitOS.iso
            build/qemu-serial.log
            build/qemu-debug.log
