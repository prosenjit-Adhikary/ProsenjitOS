name: Desktop input integration validation

on:
  push:
    branches:
      - main
      - work/desktop-integration-gate-fix
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-input:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install boot-test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Host-side input ABI and FIFO regression test
        run: |
          chmod +x scripts/test_input_host.sh
          ./scripts/test_input_host.sh

      - name: Build with warnings as errors
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Boot-test GRUB ISO
        shell: bash
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -cdrom build/prosenjitOS.iso \
            -display none \
            -serial file:build/desktop-iso-serial.log \
            -no-reboot -no-shutdown
          rc=$?
          set -e
          if (( rc != 0 && rc != 124 )); then
            echo "::error::GRUB ISO QEMU failed with status $rc"
            exit "$rc"
          fi
          cat build/desktop-iso-serial.log
          grep -Fq "ProsenjitOS: x86-64 long mode active" build/desktop-iso-serial.log
          grep -Fq "ProsenjitOS: keyboard input decoder/ring self-test passed" build/desktop-iso-serial.log
          grep -Fq "ProsenjitOS: CPL3 user-mode and IPC syscall test passed" build/desktop-iso-serial.log

      - name: Boot-test native BIOS image
        shell: bash
        run: |
          set +e
          timeout 20s qemu-system-x86_64 \
            -drive format=raw,file=build/prosenjit-native-bios.img,if=ide \
            -display none \
            -serial file:build/desktop-native-serial.log \
            -no-reboot -no-shutdown
          rc=$?
          set -e
          if (( rc != 0 && rc != 124 )); then
            echo "::error::Native BIOS QEMU failed with status $rc"
            exit "$rc"
          fi
          cat build/desktop-native-serial.log
          grep -Fq "ProsenjitOS: native bootloader handoff accepted" build/desktop-native-serial.log
          grep -Fq "ProsenjitOS: keyboard input decoder/ring self-test passed" build/desktop-native-serial.log
          grep -Fq "ProsenjitOS: CPL3 user-mode and IPC syscall test passed" build/desktop-native-serial.log

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-input-qemu-logs
          path: |
            build/desktop-iso-serial.log
            build/desktop-native-serial.log
            build/prosenjitOS.iso
            build/prosenjit-native-bios.img
